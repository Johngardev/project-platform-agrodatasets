<header
	class="flex items-center justify-between whitespace-nowrap border-b border-border-dark px-6 py-4 bg-background-dark/50 backdrop-blur-md sticky top-0 z-30 w-full">
	<div class="flex items-center gap-4 text-white w-64">
		<div class="size-8 text-primary flex items-center justify-center bg-primary/10 rounded-lg">
			<span class="material-symbols-outlined text-[24px]">eco</span>
		</div>
		<h2 class="text-lg font-bold leading-tight font-display tracking-tight">Avocado Hub</h2>
	</div>

	<div class="flex items-center gap-4 lg:gap-6 justify-end">

		<button (click)="logout()"
			class="flex items-center justify-center rounded-lg h-10 w-10 bg-surface-dark hover:bg-red-500/10 text-text-muted hover:text-red-500 transition-colors border border-border-dark cursor-pointer group"
			title="Cerrar sesión">
			<span class="material-symbols-outlined text-[20px] group-hover:scale-110 transition-transform">logout</span>
		</button>

		<div class="flex items-center gap-3 pl-2 sm:border-l sm:border-border-dark">
			<div class="flex flex-col items-end hidden sm:flex">
				<span class="text-sm font-bold text-text-primary-dark">{{ userName }}</span>
				<span class="text-[10px] uppercase font-bold tracking-wider"
					[ngClass]="userRole === 'ADMIN' ? 'text-primary' : 'text-text-muted'">
					{{ userRole === 'ADMIN' ? 'Administrator' : 'Researcher' }}
				</span>
			</div>
			<div
				class="h-10 w-10 rounded-full border-2 border-primary/30 overflow-hidden bg-surface-dark flex items-center justify-center cursor-pointer hover:border-primary transition-colors">
				<span class="material-symbols-outlined text-text-secondary-dark">person</span>
			</div>
		</div>
	</div>
</header>
