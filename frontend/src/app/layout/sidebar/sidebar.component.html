<aside
	class="w-[280px] hidden md:flex flex-col border-r border-border-dark bg-secondary-dark p-4 justify-between h-full">

	<div class="flex flex-col gap-8">
		<div class="flex items-center gap-3 px-2 cursor-pointer" routerLink="/">
			
		</div>

		<nav class="flex flex-col gap-2">

			<a routerLink="/" routerLinkActive="bg-primary/10 text-primary border-primary/20"
				[routerLinkActiveOptions]="{exact: true}"
				class="flex items-center gap-3 px-3 py-3 rounded-lg hover:bg-white/5 text-text-muted hover:text-white border border-transparent transition-colors cursor-pointer">
				<span class="material-symbols-outlined">dashboard</span>
				<p class="text-sm font-medium leading-normal font-display">Dashboard</p>
			</a>

			<a routerLink="/upload" routerLinkActive="bg-primary/10 text-primary border-primary/20"
				class="flex items-center gap-3 px-3 py-3 rounded-lg hover:bg-white/5 text-text-muted hover:text-white border border-transparent transition-colors cursor-pointer">
				<span class="material-symbols-outlined">upload_file</span>
				<p class="text-sm font-medium leading-normal font-display">Upload Data</p>
			</a>

      <a routerLink="/library" routerLinkActive="bg-primary/10 text-primary border-primary/20"
        class="flex items-center gap-3 px-3 py-3 rounded-lg hover:bg-white/5 text-text-muted hover:text-white border border-transparent transition-colors cursor-pointer">
        <span class="material-symbols-outlined">library_books</span>
        <p class="text-sm font-medium leading-normal font-display">My Library</p>
      </a>

      <a routerLink="/settings" routerLinkActive="bg-primary/10 text-primary border-primary/20"
        class="flex items-center gap-3 px-3 py-3 rounded-lg hover:bg-white/5 text-text-muted hover:text-white border border-transparent transition-colors cursor-pointer">
        <span class="material-symbols-outlined">settings</span>
        <p class="text-sm font-medium leading-normal font-display">Settings</p>
      </a>

		</nav>
	</div>

	<div class="flex flex-col gap-4">
		<button routerLink="/upload"
			class="flex w-full cursor-pointer items-center justify-center gap-2 rounded-lg h-12 px-4 bg-primary hover:bg-primary-hover text-white text-sm font-bold transition-colors shadow-lg shadow-primary/20">
			<span class="material-symbols-outlined text-[20px]">add</span>
			<span>New Upload</span>
		</button>
	</div>
</aside>
